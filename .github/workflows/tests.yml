name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test deps
        run: python3 -m pip install --quiet pytest pyyaml jinja2 cryptography requests
      - name: Framework lib tests
        run: python3 -m pytest scripts/lib/tests/ -q --tb=short
      # The token-broker (push chokepoint) and git-guard are security code — run
      # their suites too so a regression in the mission-file-lock / structural-push
      # detector is caught here. Run separately: each dir has its own conftest.py.
      - name: Token-broker tests
        run: python3 -m pytest token-broker/tests/ -q --tb=short
      - name: Git-guard tests
        run: python3 -m pytest git-guard/tests/ -q --tb=short
      # Deploy-time hooks (SessionStart re-arm #754, mission-file guard, output
      # guard) run on every live agent. They were previously untested in CI, so a
      # regression in the compact re-arm (loop goes dormant, #754) could ship
      # silently. Gate them here.
      - name: Deploy hooks tests
        run: python3 -m pytest deploy/hooks/ -q --tb=short

  console-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install console deps
        run: python3 -m pip install --quiet pytest -r console/requirements.txt
      - name: Console tests
        run: python3 -m pytest console/tests/ -q --tb=short
