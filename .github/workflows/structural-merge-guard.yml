name: structural-merge-guard

# Board #1432 (option C2). Blocks merging a PR that changes STRUCTURAL /
# mission-definition paths unless it carries an APPROVED review authored by the
# trusted cockpit App bot (an identity the fleet's agents cannot impersonate).
# Make this a REQUIRED status check in branch protection to enforce it (see
# .github/scripts/README-structural-merge-guard.md). Runtime direct-pushes to
# main do not go through PRs, so they are unaffected.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: structural-merge-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for policy.py + the guard script)
        uses: actions/checkout@v4

      - name: Structural merge guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Override via repo variable APPROVER_BOT once the App's bot login is known.
          APPROVER_BOT: ${{ vars.APPROVER_BOT || 'cockpit-approver[bot]' }}
          # The App's bot ACCOUNT id (not the App id 5019127 — a different
          # number; see pr_approver.APPROVER_BOT_ID's docstring). Override
          # via repo variable if the App's bot account is ever recreated.
          APPROVER_BOT_ID: ${{ vars.APPROVER_BOT_ID || '331993040' }}
        run: |
          set -euo pipefail
          # Paginate both lists (PRs can exceed one page of files/reviews).
          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '[.[]|{path:.filename}]')
          # Board #1461 review follow-up: `type` and `id` are REQUIRED here,
          # not just `login` — the guard script now matches all three (login
          # exact + type=="Bot" + id) so a plain human account cannot satisfy
          # the gate merely by registering a same-named GitHub username.
          reviews=$(gh api --paginate "repos/$REPO/pulls/$PR/reviews" --jq '[.[]|{user:{login:.user.login,type:.user.type,id:.user.id},state:.state,commit_id:.commit_id}]')
          jq -n --argjson files "$files" --argjson reviews "$reviews" \
            '{files:$files, reviews:$reviews}' \
          | python3 .github/scripts/structural_merge_guard.py \
              --repo "$REPO" --head-sha "$HEAD_SHA" --approver-bot-id "$APPROVER_BOT_ID"
