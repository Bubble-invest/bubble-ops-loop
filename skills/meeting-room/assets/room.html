<title>Salle de coordination</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: chat app — header, scrolling thread, composer pinned at the bottom. */
:root{
  --bg:#f1f3ef; --surface:#ffffff; --ink:#1f2a24; --muted:#5f6b63; --line:#d6ddd6; --accent:#2f6f5e; --seat:#e3efe9; --me:#e9f1ee;
  --c-joris:#2f6f5e; --c-ben:#2b5fa8; --c-miranda:#a8457a; --c-tony:#8a5a12; --c-rick:#5b4fc4;
  --f-display:"Fraunces",Georgia,serif; --f-body:"Source Sans 3",system-ui,-apple-system,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#141a17;--surface:#1c2420;--ink:#e4ebe6;--muted:#9aa89f;--line:#2e3a34;--accent:#7cc4ad;--seat:#20352d;--me:#1f2e28;--c-joris:#7cc4ad;--c-ben:#8db4f0;--c-miranda:#e59bc3;--c-tony:#e0b56b;--c-rick:#aaa2f5;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141a17;--surface:#1c2420;--ink:#e4ebe6;--muted:#9aa89f;--line:#2e3a34;--accent:#7cc4ad;--seat:#20352d;--me:#1f2e28;--c-joris:#7cc4ad;--c-ben:#8db4f0;--c-miranda:#e59bc3;--c-tony:#e0b56b;--c-rick:#aaa2f5;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body)}
.app{height:100%;max-width:820px;margin:0 auto;padding-inline:16px;display:grid;grid-template-rows:auto 1fr auto;gap:0}
header{padding-block:18px 12px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.eyebrow{font:500 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font:500 26px/1.15 var(--f-display);margin:0}
.people{display:flex;flex-wrap:wrap;gap:6px}
.people span{font:500 12px var(--f-mono);border-radius:999px;padding:3px 9px;background:var(--seat);color:var(--c)}
#thread{overflow-y:auto;padding-block:14px;display:flex;flex-direction:column;gap:12px;min-height:0}
.empty{margin:auto;color:var(--muted);text-align:center;max-width:40ch}
.msg{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:start}
.av{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--surface);background:var(--c);font:600 14px var(--f-mono)}
.body{min-width:0}
.head{display:flex;gap:8px;align-items:baseline}
.head b{color:var(--c);font-weight:600}
.head time{font:12px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.text{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:2px}
.text .tag{font:500 13px var(--f-mono);color:var(--accent);background:var(--seat);border-radius:4px;padding:0 4px}
.msg.mine .body{background:var(--me);border-radius:8px;padding:6px 10px}
footer{border-top:1px solid var(--line);padding-block:10px 16px;display:grid;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font:500 12px var(--f-mono);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:3px 10px;cursor:pointer}
.chips button:hover{border-color:var(--accent)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
textarea{font:15px/1.4 var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;resize:none;min-height:44px;max-height:160px}
textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#send{font:600 14px var(--f-body);background:var(--accent);color:var(--surface);border:0;border-radius:8px;padding:0 16px;cursor:pointer}
#send:disabled{opacity:.5;cursor:default}
.hint{font:12px var(--f-mono);color:var(--muted)}
.status{font:12px var(--f-mono);color:var(--muted)}
</style>

<div class="app" lang="fr">
  <header>
    <div class="eyebrow">Salle temporaire · {{TOPIC}} · ouverte le {{DATE}}</div>
    <h1>Salle de coordination</h1>
    <div class="people" aria-label="Participants">
      <span style="--c:var(--c-joris)">Joris</span>
      <span style="--c:var(--c-tony)">@tony · Direction</span>
      <span style="--c:var(--c-ben)">@ben · Fonds</span>
      <span style="--c:var(--c-miranda)">@miranda · Contenu</span>
      <span style="--c:var(--c-rick)">@rick · Méthodes IA</span>
    </div>
  </header>

  <main id="thread" aria-live="polite">
    <p class="empty" id="empty">Chargement du fil… Écris un message en bas et tague qui doit répondre. Les agents passent toutes les 2 minutes pendant la réunion.</p>
  </main>

  <footer>
    <div class="chips" aria-label="Taguer">
      <button type="button" data-t="@all">@all</button>
      <button type="button" data-t="@tony">@tony</button>
      <button type="button" data-t="@ben">@ben</button>
      <button type="button" data-t="@miranda">@miranda</button>
      <button type="button" data-t="@rick">@rick</button>
    </div>
    <form class="row" id="form">
      <label for="msg" class="hint" hidden>Message</label>
      <textarea id="msg" rows="1" placeholder="Message… (Entrée pour envoyer, Maj+Entrée pour aller à la ligne)"></textarea>
      <button id="send" type="submit" disabled>Envoyer</button>
    </form>
    <div class="status" id="status">Connexion…</div>
  </footer>
</div>

<script>
const WHO = {
  joris:{name:"Joris",c:"var(--c-joris)"}, tony:{name:"Tony",c:"var(--c-tony)"},
  ben:{name:"Ben",c:"var(--c-ben)"}, miranda:{name:"Miranda",c:"var(--c-miranda)"},
  rick:{name:"Rick",c:"var(--c-rick)"}
};
const thread = document.getElementById("thread");
const empty = document.getElementById("empty");
const form = document.getElementById("form");
const input = document.getElementById("msg");
const send = document.getElementById("send");
const statusEl = document.getElementById("status");
let col = null, myKey = "joris";

function fmt(ts){ try{ const d=new Date(ts); return d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}); }catch(e){ return ""; } }
function renderText(el, text){
  el.textContent = "";
  String(text||"").split(/(@[a-z]+)/gi).forEach(part=>{
    if(/^@[a-z]+$/i.test(part)){ const s=document.createElement("span"); s.className="tag"; s.textContent=part; el.appendChild(s); }
    else el.appendChild(document.createTextNode(part));
  });
}
function render(docs){
  const atBottom = thread.scrollHeight - thread.scrollTop - thread.clientHeight < 80;
  thread.querySelectorAll(".msg").forEach(n=>n.remove());
  empty.hidden = docs.length > 0;
  if(!docs.length) empty.textContent = "Aucun message pour l’instant. Écris en bas et tague qui doit répondre (@all pour tout le monde).";
  for(const d of docs){
    const m = d.data() || {};
    const who = WHO[m.author] || {name:String(m.author||"?"), c:"var(--muted)"};
    const row = document.createElement("article");
    row.className = "msg" + (m.author===myKey ? " mine" : "");
    row.style.setProperty("--c", who.c);
    const av = document.createElement("div"); av.className="av"; av.textContent = who.name.charAt(0);
    const body = document.createElement("div"); body.className="body";
    const head = document.createElement("div"); head.className="head";
    const b = document.createElement("b"); b.textContent = who.name;
    const t = document.createElement("time"); t.textContent = fmt(m.ts); if(m.ts) t.dateTime = m.ts;
    head.append(b,t);
    const tx = document.createElement("div"); tx.className="text"; renderText(tx, m.text);
    body.append(head, tx); row.append(av, body); thread.appendChild(row);
  }
  if(atBottom) thread.scrollTop = thread.scrollHeight;
}

document.querySelectorAll(".chips button").forEach(btn=>btn.addEventListener("click",()=>{
  const tag = btn.dataset.t + " ";
  input.value = input.value.includes(btn.dataset.t) ? input.value : tag + input.value;
  input.focus(); send.disabled = !input.value.trim() || !col;
}));
input.addEventListener("input",()=>{ send.disabled = !input.value.trim() || !col; input.style.height="auto"; input.style.height=Math.min(input.scrollHeight,160)+"px"; });
input.addEventListener("keydown",e=>{ if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); form.requestSubmit(); } });
form.addEventListener("submit", async e=>{
  e.preventDefault();
  const text = input.value.trim(); if(!text || !col) return;
  const to = [...new Set((text.match(/@([a-z]+)/gi)||[]).map(s=>s.slice(1).toLowerCase()))];
  send.disabled = true;
  try{
    await col.add({author: myKey, text, to, ts: new Date().toISOString()});
    input.value=""; input.style.height="auto"; statusEl.textContent = "Envoyé.";
  }catch(err){ statusEl.textContent = "Envoi impossible (" + (err && err.code || "erreur") + "). Ton message est gardé ci-dessus."; send.disabled=false; }
});

(async ()=>{
  const db = await claude.use("db");
  if(!db){ statusEl.textContent = "Fil indisponible dans cette vue."; empty.textContent = "Le fil ne peut pas se charger ici."; return; }
  col = db.collection("messages");
  try{ const user = await claude.use("user"); if(user && !(await user.isOwner())) myKey = "invite"; }catch(e){}
  col.orderBy("ts","asc").limit(500).onSnapshot(
    snap=>{ render(snap.docs); statusEl.textContent = "En direct · " + snap.size + " message" + (snap.size>1?"s":""); send.disabled = !input.value.trim(); },
    err=>{ statusEl.textContent = "Connexion au fil perdue (" + (err && err.code || "erreur") + "). Recharge la page."; }
  );
})();
</script>
