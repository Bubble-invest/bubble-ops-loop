version: 1
fragment_max_age_hours: 36
fragment_dirs:
  - /home/claude/.claude/projects/_fleet-architecture-fragments

# These are bounded, agent-reviewed semantic judgments. They are deliberately
# sparse: unreviewed items stay unresolved instead of inheriting a blanket tag.
intent_bindings:
  map:
    links: ["[[shared/operator-intents/system-convergence-north-star]]"]
    why: Makes the fleet, host, tool, skill, mission, and scheduler surfaces visible together so R&D can measure and converge the system as the north-star requires.
  items:
    rick:
      "skill:rnd-loop":
        links: ["[[shared/operator-intents/system-convergence-north-star]]"]
        why: The north-star explicitly governs the R&D loop; this skill is the fleet manager loop that measures drift and routes convergence work.
      "tool:fleet":
        links: ["[[shared/operator-intents/system-convergence-north-star]]"]
        why: This tool surface observes the fleet as one system, which directly supports cross-host convergence and stability.
      "tool:wiki":
        links: ["[[shared/operator-intents/system-convergence-north-star]]"]
        why: Shared wiki tooling gives the fleet a common knowledge surface, reducing fragmented agent state.
      "tool:memory-hygiene":
        links: ["[[shared/operator-intents/system-convergence-north-star]]"]
        why: Memory hygiene keeps shared and agent knowledge coherent enough for the fleet to converge on current facts.
      "tool:skills-symlink-sync":
        links: ["[[shared/operator-intents/system-convergence-north-star]]"]
        why: Skill synchronization reduces host-specific drift in the shared agent framework.
      "tool:mac-fleet-autosave":
        links: ["[[shared/operator-intents/system-convergence-north-star]]"]
        why: Fleet autosave preserves recoverable, consistent Mac agent state as part of the stable whole-system target.
    tony:
      "skill:dept-output-reader":
        links: ["[[shared/operator-intents/system-convergence-north-star]]"]
        why: Reading department outputs lets the CEO coordinator see and align work across otherwise separate agents.
      "skill:kpi-aggregator":
        links: ["[[shared/operator-intents/system-convergence-north-star]]"]
        why: Fleet-level KPI aggregation measures whether departments are operating as a coherent, stable system.
      "tool:read-child-export":
        links: ["[[shared/operator-intents/system-convergence-north-star]]"]
        why: Child export collection is an explicit dependency bridge from department agents into fleet coordination.
      "tool:read-child-kpis":
        links: ["[[shared/operator-intents/system-convergence-north-star]]"]
        why: Child KPI collection provides the cross-department feedback needed to detect system drift.
      "mission:dept-kpi-watch":
        links: ["[[shared/operator-intents/system-convergence-north-star]]"]
        why: This mission watches department health across the fleet and turns divergence into coordinated action.

